name: Publish to npm

# Fully automatic publishing via npm Trusted Publishing (OIDC) — no NPM_TOKEN.
# On every push to main, CI checks whether package.json's version is already on
# npm; if not, it publishes. Releasing is just: bump "version", commit, push.
# Re-running on an unchanged version is a no-op (it skips), so this never errors
# on duplicates.
#
# One-time setup on npmjs.com (dsh-hot-reload → Settings → Trusted Publisher):
#   Organization or user: stuarthu
#   Repository:           dsh-hot-reload
#   Workflow filename:    publish.yml
#   Allowed action:       npm publish
# Auth is a short-lived OIDC token minted per run (id-token: write); the npm CLI
# detects and uses it automatically — no secret to store or rotate.
# (Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0, ensured below.)

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # trusted publishing needs Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest # needs >= 11.5.1

      - name: Skip if this version is already published
        id: guard
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: the npm CLI authenticates via the OIDC credential
      # granted by `id-token: write`, verified against the trusted publisher
      # configured on npmjs.com.
      - name: Publish
        if: steps.guard.outputs.publish == 'true'
        run: npm publish --provenance --access public
