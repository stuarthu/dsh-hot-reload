name: Publish to npm

# Fully automatic publishing — no manual step. On every push to main, CI checks
# whether package.json's version is already on npm; if not, it publishes. So a
# release is just: bump "version" in package.json, commit, push. Re-running on an
# unchanged version is a no-op (it skips), so this never errors on duplicates.
#
# Auth: the NPM_TOKEN repo secret (an npm Automation token — 2FA-exempt, works in
# CI). Provenance is attested via GitHub OIDC (id-token: write). Runs on
# GitHub-hosted runners; no self-hosted runner needed.

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Skip if this version is already published
        id: guard
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.guard.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
